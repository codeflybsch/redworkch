services:
  postgres:
    image: postgres:16-alpine
    container_name: redwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redwork
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: redwork_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redwork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
